name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python3 -m unittest discover -s tests -v
  # Automatic companion updates (companion/auto) on the systems players use, including a real
  # scheduled task on Windows and a real launch agent on macOS.
  auto:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python -m unittest discover -s tests -p "test_auto*.py" -v
        env:
          AIC_TEST_LAUNCHD: "1"
